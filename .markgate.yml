# markgate configuration — https://github.com/go-to-k/markgate
#
# The `check`, `docs`, `verify-pr` and `pr-review` gates were removed with the
# hooks that read them: a stale marker harms nobody at the moment of the commit.
# `/check`, `/check-docs` and `/verify-pr` remain the recommended procedure and
# their checklists still apply in full — nothing enforces them. The mechanical
# merge conditions are CI green (`.claude/hooks/ci-green-gate.sh`) and a clean
# bug-hunt sentinel (`.claude/hooks/bughunt-clean-gate.sh`).
#
# This file must keep existing: `branch-gate.sh` uses a `.markgate.yml` at the
# target repo's top level as its repo opt-in signal.
#
# integ — real-AWS verification. A run here deploys real stacks into us-east-1
#         and `inject-drift` / `revert` WRITE to the maintainer's account, so the
#         path it covers clears the blocking criterion in CLAUDE.md's Tooling
#         Policy exactly as cdkd's `integ-destroy` does. It is a DECLARATION
#         only: no hook reads it and no skill sets it, because cdkrd has no
#         companion `/run-integ`. Wiring one is new machinery and the
#         maintainer's call.
#
#         It is on `hash: diff` (markgate 0.4+, go-to-k/cdk-real-drift#1756):
#         the digest is the working-tree delta against
#         `merge-base(origin/main, HEAD)` restricted to the include set, so a
#         merge arriving from `main` that moves an UNRELATED in-scope file does
#         not invalidate the marker, while any in-scope edit on this branch
#         still does. `base:` is mandatory for a diff gate and is pinned to
#         `origin/main` explicitly: markgate has no `origin/HEAD` fallback and
#         that ref is commonly unset in CI clones, which would make the same
#         gate mean different things locally and in CI. Accepted cost:
#         cross-FILE interaction goes unseen. On a clean `main` the delta is
#         empty and markgate ERRORS (exit 2) rather than silently passing.
#
# Bug-hunt cleanup is NOT a markgate gate — it is a sentinel-file gate
# (.markgate-bughunt-pending + .claude/hooks/bughunt-clean-gate.sh), armed by
# /hunt-bugs's bughunt-track.sh and by deploy-autoarm-gate.sh BEFORE any deploy,
# and released only after every deployed stack is deleted + SWEEP CLEAN. A
# sentinel (not a content hash) is used deliberately: it tracks outstanding live
# resources regardless of which files a later commit happens to touch, so a
# deployed stack can never be forgotten.

gates:
  integ:
    hash: diff
    base: origin/main
    ttl: 14d
    include:
      - 'src/**'
      - 'tests/integration/**'
