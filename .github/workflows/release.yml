name: Release

# Batched releases via release-please (issue: release-per-merge cadence was too
# high). Every push to main creates/updates a single "chore(release): <ver>"
# release PR; merging THAT PR creates the tag + GitHub release and publishes to
# npm. Ordinary feat/fix merges no longer publish anything by themselves.
#
# v0 guard: cdk-real-drift deliberately stays at major version 0. Two
# independent layers enforce it:
#   1. release-please-config.json sets bump-minor-pre-major: true, so a
#      breaking change bumps MINOR (0.x.0), never 1.0.0.
#   2. The publish job below hard-fails before npm publish if the computed
#      major is not 0 (covers a manual Release-As: 1.0.0 override too).
#
# npm auth is OIDC trusted publishing (id-token: write + registry-url), bound
# to THIS workflow filename on npmjs.com — do not rename release.yml without
# updating the trusted publisher config.
#
# Known behavior: the release PR is created with GITHUB_TOKEN, and GitHub
# suppresses workflow triggers for GITHUB_TOKEN-created events — so the release
# PR triggers no pull_request workflows and carries no CI checks. Note this
# repo's ci-green-gate FAILS OPEN on "no checks reported" (see its header), so
# an agent-side `gh pr merge` of the release PR is NOT mechanically blocked
# here — merging it via the web UI, and never without the maintainer asking
# for a release, is convention, not enforcement. Giving the release-please
# step a PAT instead of GITHUB_TOKEN would restore CI on it.
#
# STALE STANDING RELEASE PR — the trap workflow_dispatch below exists for.
# release-please does NOT rebuild a standing release PR when the release it
# computes is unchanged: it logs `PR #N remained the same` and leaves the
# branch on the base it was cut from. So anything that later lands on main in a
# file release-please OWNS — CHANGELOG.md, package.json's version,
# .release-please-manifest.json — is simply MISSING from that branch, and
# GitHub still reports the PR MERGEABLE. Merging it then takes the branch's
# stale copy of those files and REVERTS whatever landed. There is no conflict
# to warn you: the symptom is a green, mergeable PR that quietly undoes work.
# MEASURED in the sibling repo: release PR go-to-k/cdkd#2503 was cut before the
# CHANGELOG normalization merged, its branch still carried the pre-
# normalization file, and merging it would have undone 285 header conversions.
#
# REMEDY: close the release PR, delete its branch, and re-run this workflow —
# release-please recomputes the identical release from current main, this time
# on top of the new commits (verified in the sibling: the recreated PR inserts
# the entry at the top). It is safe to run at any time because release-please
# is idempotent: a run that finds nothing new leaves the standing PR alone and
# publishes nothing.
#
# `workflow_dispatch` is what makes that remedy runnable. Without it the only
# trigger is `push: main`, so re-running the release means re-running an old
# push run from the Actions UI — which is how the sibling had to do it.
# Note the `concurrency` group below is a literal, not a trigger-dependent
# expression, so a dispatched run shares the group with push runs: with
# `cancel-in-progress: false` it QUEUES behind an in-progress push run rather
# than cancelling it (and, per the one-pending-run rule noted there,
# supersedes an older still-pending run). Nothing is lost either way, since
# every run recomputes from full history.

on:
  push:
    branches:
      - main
  # Manual re-run, for recreating a stale standing release PR (see above).
  workflow_dispatch:

# Serialize Release workflow runs so a back-to-back merge (#204 + #205 landed
# within ~30s under semantic-release and the earlier run's tag push raced the
# later commit's fast-forward). release-please updates a single standing PR, so
# concurrent runs would only churn that PR — queue them instead. Note GitHub's
# pending queue holds only ONE run per group: with `cancel-in-progress: false`
# the in-progress run finishes, and a newer pending run SUPERSEDES an older
# pending one. That is fine here — release-please recomputes from the full
# commit history on every run, so the newest run sees all batched commits.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Enforce v0 (never publish a v1+ release)
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: ${{ needs.release-please.outputs.major }}
        run: |
          set -eu
          VERSION="${TAG_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_NAME)"
            exit 1
          fi
          if [ "$MAJOR" != "0" ]; then
            echo "::error::Refusing to publish $TAG_NAME: cdk-real-drift is intentionally kept at major version 0 (bump-minor-pre-major). Delete the tag/release and fix the version source."
            exit 1
          fi
          case "$VERSION" in
            0.*) ;;
            *)
              echo "::error::Refusing to publish $TAG_NAME: version does not start with 0."
              exit 1
              ;;
          esac

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: '24'
          cache: true
          run-install: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run build

      - name: Publish to npm
        run: npm publish
