name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      # Run lint/format via `vp check` and REDIRECT its output to a file, printing it only
      # on failure. `vp check` (the Rust oxc tool) PANICS while writing its large warning
      # output to CI's non-blocking stdout pipe:
      #   Vite+ panicked … failed printing to stdout: Resource temporarily unavailable (os error 11)
      # Once main's lint output grew to ~109 warnings this turned main + every PR red (as
      # `vp run check` exit 134 / bare `vp check` exit 1) even though the check itself finds
      # 0 ERRORS — warnings are advisory, not failures. Writing to a regular FILE is blocking
      # I/O, so the EAGAIN that triggers the panic never happens; the warnings are captured
      # but only surfaced when the check actually fails. `vp check` still exits non-zero on a
      # real lint/format ERROR, which we propagate. (Upstream Vite+ stdout-panic bug — the
      # tool itself prints "This is a bug in Vite+, not your code".) The same panic hit
      # `vp run check` LOCALLY (exit 134 on a clean tree, #1761), so the `check` run-task in
      # vite.config.ts now applies this identical redirect — keep the two in sync.
      - run: vp check >vpcheck.log 2>&1 || { cat vpcheck.log; exit 1; }
      # Build BEFORE test: tests/json-empty-on-error.test.ts (#943/#988/#989) spawns the
      # built `dist/cli.js` end to end, so `dist/` must exist when `vp run test` runs. The
      # old order (test before build) left dist absent/stale and the spawned CLI exited 1
      # ("Cannot find module") — 9 false failures on main only, green in local gates that
      # `vp pack` first (#987-era CI red). `vp run build` is uncached (vite.config.ts), so
      # this always rebuilds — no stale-dist replay.
      - run: vp run build
      - run: vp run test
      # The gate harnesses are shell, so `vp run test` (vitest) never sees them.
      # They went unrun by anything until go-to-k/cdk-real-drift#1797.
      - run: vp run test:hooks

      # go-to-k/cdk-local#402 diagnostics (upstream Vite+ forks-pool crash, NOT a
      # cdk-real-drift issue): if a forks worker crashed ("Worker exited
      # unexpectedly"), Node's --report-on-fatalerror / --report-uncaught-exception
      # (armed in vite.config.ts) wrote a report.*.json with the native + JS
      # stack and open libuv handles. Dump any report to the log on failure so
      # the next crash pinpoints the offending native handle. No-op on success.
      - name: Dump Node diagnostic reports (on failure)
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for f in report.*.json; do
            found=1
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
          [ "$found" = 0 ] && echo "No Node diagnostic report written (worker did not hit a fatal/uncaught crash)."
          exit 0

  runtime-compat:
    runs-on: ubuntu-latest
    needs: check-build-test
    strategy:
      matrix:
        # The first row is the EXACT published floor (`package.json`
        # `engines.node`, as major.minor), so this smoke proves the promised
        # minimum and not merely "some 22.x"; the rest are the later majors,
        # the dev pin (`.node-version`) among them. Quoted so YAML keeps the
        # spelling verbatim (an unquoted 22.10 would parse as the float 22.1).
        # `tests/node-floor-sync-1905.test.ts` pins this row to the engines
        # range.
        node-version: ['22.12', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: vp env exec --node ${{ matrix.node-version }} node dist/cli.js --version

  # English-only, on the PR DIFF. `.claude/hooks/non-english-text-gate.sh` used
  # to refuse `gh pr create` / `edit` / `merge` on it; the hook was deleted with
  # the rest of the gates that do not clear the blocking criterion (the harm is
  # reversible and lands on this repo's own artifact), which left the rule with
  # nothing but a sentence in AGENTS.md. This is where a reversible content rule
  # belongs.
  #
  # IN ci.yml, not in a workflow of its own, even though it installs nothing and
  # runs in seconds: `ci-ok` is the SINGLE check the `main` ruleset requires and
  # it can only aggregate jobs in THIS file. A separate workflow would be a
  # check nobody is required to pass, and the DIFF is the surface that must not
  # be skippable.
  #
  # The PR's own TITLE and BODY are a different surface and live in
  # `pr-content-checks.yml`, because they must re-run on an `edited` event and
  # this workflow deliberately does not list `types:` -- adding `edited` here
  # would re-run the whole build and suite on every title typo.
  #
  # `pull_request`, never `pull_request_target`: the job only has to say NO. A
  # failing check run is its entire output, it needs no write scope, and
  # `pull_request_target` would hand a WRITE token and this repo's secrets to a
  # workflow whose whole job is to refuse.
  english-only:
    name: English-only (PR diff)
    # The one job-level `if:` added here, and it is the same shape
    # `release-pr-not-stale` carries: on a `push` to main there is no
    # `github.event.pull_request`, so every ref below would render empty and the
    # scripts would fail closed on every push. Skipped is a verdict `ci-ok`
    # accepts; exempted by name in tests/ci-ok-gate.test.ts.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Any GitHub user can open a PR and spawn this job, so it carries a cap
    # rather than the 360-minute default.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # SAME-REPO PR -> the head; FORK PR -> the base.
          #
          # Two requirements pull opposite ways and both are real. TRUST: a fork
          # PR must not supply the checker that judges it -- edit the script to
          # `process.exit(0)`, or add your own file to the allow-list, and this
          # required check reports green while the violation ships. BOOTSTRAP:
          # pinning base unconditionally means the PR that ADDS a checker runs a
          # base that does not contain it, so the job dies with
          # ERR_MODULE_NOT_FOUND and can never go green.
          #
          # Fork-ness resolves both: a same-repo branch is pushed by someone who
          # already has write access, so taking the checker from the head grants
          # them nothing they do not have; a fork author has no such access, and
          # for them the base copy is the only trustworthy one. The CONTENT under
          # test always comes from `$HEAD_SHA` inside the script either way, so
          # this decides only WHICH CHECKER runs, never WHAT is checked.
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.sha
            || github.event.pull_request.base.sha }}
          # Load-bearing: the script runs `git merge-base <base> <head>` for the
          # same three-dot view `gh pr diff` gave the hook. A shallow clone makes
          # that fail -- and the script treats that as an ERROR, not a pass, so a
          # regression here goes red rather than silently scanning nothing.
          fetch-depth: 0

      # The head commit is not an ancestor of base, and for a FORK PR it is not
      # on any branch of this repo -- it lives at `refs/pull/N/head`. Fetch it as
      # DATA so `git show $HEAD_SHA:<path>` and `git merge-base` resolve. Nothing
      # from it is executed.
      - name: Fetch the PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}/head"

      # Node 24 strips type annotations, so `node scripts/*.ts` runs directly.
      # `run-install: false` and `cache: false`: both checkers import node
      # builtins only, deliberately, so this check cannot be blocked by a
      # lockfile problem. A runner whose node cannot strip types fails LOUDLY
      # ("Unknown file extension .ts"), never silently.
      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1
        with:
          node-version: '24'
          cache: false
          run-install: false

      - name: Non-English writing-system characters in the PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr-non-english-text.ts

  # A stale standing release PR is MERGEABLE and silently reverts main.
  # release-please does not rebuild a release PR whose computed release is
  # unchanged — it logs `PR #N remained the same` and leaves the branch on the
  # base it was cut from. A `chore:` / `ci:` / `docs:` commit produces no
  # changelog entry, so it lands on main WITHOUT the release branch following;
  # if it touched a file release-please owns, merging the PR takes the branch's
  # older copy, and GitHub reports MERGEABLE throughout.
  #
  # The remedy has always been "close the PR, delete its branch, re-run
  # release.yml"; what was missing is anything that makes the condition VISIBLE
  # before the merge. A human reading the diff was that check. Auto-merge on
  # the release PR removes the human, so the check has to become a required
  # status.
  #
  # `package.json` is deliberately NOT inspected: `chore(deps)` PRs touch it
  # constantly, and release-please's own diff there is the `version` line
  # alone — a three-way merge of that cannot revert a dependency line, so
  # including it would block every release PR that is merely behind.
  #
  # A fork contributor can name a branch `release-please--x` and enter this job.
  # That is harmless and deliberately not guarded against: the job reads only
  # git ancestry and can do nothing but fail their own PR. Guarding on the PR
  # author instead would add a SECOND way for the job to go silently inert,
  # which is the failure mode tests/ci-ok-gate.test.ts prevents.
  release-pr-not-stale:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The PR HEAD, not the default `refs/pull/N/merge`. That ref has the base
      # branch already merged into it, so every ancestry question below would
      # answer "yes" no matter how stale the branch actually is — a vacuous
      # pass, and the only way this job can be wrong in the unsafe direction.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: release-please-owned files on main must be ancestors of this branch
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          stale=0
          for f in CHANGELOG.md .release-please-manifest.json; do
            tip=$(git rev-list -1 FETCH_HEAD -- "${f}")
            # An empty answer means the file has no history on main at all —
            # renamed, deleted, or never committed. The guard cannot answer the
            # question it was added to answer, and "cannot answer" is a failure
            # rather than a pass.
            if [ -z "${tip}" ]; then
              echo "::error::${f} has no commit history on main. This guard cannot evaluate staleness, so it fails closed. If the file was renamed, update this job."
              exit 1
            fi
            if ! git merge-base --is-ancestor "${tip}" HEAD; then
              echo "::error::${f} was last changed on main by ${tip}, which is NOT an ancestor of this release branch — the branch is stale and merging it would revert that change. Close this PR, delete its branch, and re-run release.yml via workflow_dispatch to recreate it from current main."
              stale=1
            fi
          done
          [ "${stale}" -eq 0 ]

  # The single check name the `main` branch ruleset requires. It exists instead
  # of the ruleset naming the real jobs for two reasons:
  #
  #   1. `runtime-compat` is a matrix. A required check has to match the
  #      EXPANDED name (`runtime-compat (22.12)`), but a matrix job that never
  #      starts — because `check-build-test` failed — reports under the
  #      UNEXPANDED name (`runtime-compat`). Requiring either spelling leaves
  #      the other permanently "Expected", which blocks the PR forever.
  #   2. Adding or renaming a job above then needs a line in `needs:` here
  #      rather than an edit to repository settings nothing in this tree can
  #      review.
  #
  # `if: always()` is load-bearing. Without it this job is SKIPPED whenever an
  # upstream job fails, and a skipped required check counts as PASSING — the
  # gate would report green exactly when CI is red.
  #
  # What this check does and does not attest to, stated so the ruleset change is
  # made with eyes open: on a `pull_request` trigger the workflow DEFINITION
  # comes from the PR's own ref, so a fork author can rewrite this job to `exit
  # 0` and the required check reports green. That is a property of every
  # `pull_request`-based required check, not something aggregating into one name
  # introduced — requiring `check-build-test` directly was defeatable the same
  # way. The controls are unchanged: the edit is visible in the diff, a
  # first-time contributor's run needs maintainer approval, and a fork token is
  # read-only. Human review of a workflow diff remains the control.
  #
  # Every PR check in this repo is reachable from `needs:` below: no workflow
  # here carries a `paths:` filter, and `pr-inherit-issue-labels.yml` runs on
  # `pull_request_target`, which is not a PR check. So `ci-ok` plus
  # `pr-title-check.yml`'s `check` is the whole required set.
  ci-ok:
    if: always()
    needs: [check-build-test, runtime-compat, english-only, release-pr-not-stale]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      # Through `env:` rather than inline in `run:`. The value space here is a
      # closed enum so inline is safe today, but expression data reaching a
      # shell as a variable rather than as source text is the safer default.
      RESULTS: ${{ join(needs.*.result, ' ') }}
      # Must equal the length of `needs:` above. Both halves are read out of
      # this file by tests/ci-ok-gate.test.ts, which also asserts `needs:`
      # covers every other job — so this cannot drift silently.
      EXPECTED_UPSTREAM: '4'
    steps:
      - name: every upstream job succeeded or was skipped
        run: |
          set -euo pipefail
          # `skipped` is accepted on purpose: release-pr-not-stale skips on
          # every non-release PR, english-only skips on a `push` to main, and a
          # matrix job skipped because its `needs` failed is already reported by
          # that failing job's own result.
          echo "upstream results: ${RESULTS}"
          seen=0
          for r in ${RESULTS}; do
            seen=$((seen + 1))
            case "${r}" in
              success | skipped) ;;
              *)
                echo "::error::an upstream CI job reported '${r}' — this gate is red. See the run summary for which job."
                exit 1
                ;;
            esac
          done
          # Without this, "every result was good" and "there were no results"
          # are the same exit 0: an empty render makes the loop above run zero
          # times. This job is the SOLE required status check, so a vacuous
          # green here is a merge gate that examined nothing.
          if [ "${seen}" -ne "${EXPECTED_UPSTREAM}" ]; then
            echo "::error::examined ${seen} upstream result(s), expected ${EXPECTED_UPSTREAM}. The needs list did not reach this step, so this gate attests to nothing and fails closed."
            exit 1
          fi
