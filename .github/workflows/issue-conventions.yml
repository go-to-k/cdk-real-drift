name: Issue conventions

# English-only on the ISSUE surfaces. The PR surfaces -- the diff and the PR's
# own title and body -- are covered by ci.yml's `english-only` job, which is
# there rather than here because `ci-ok` can only aggregate jobs in that file
# and `ci-ok` is the single check the `main` ruleset requires. An issue or a
# comment has no check-run surface a human will look at, so this job posts a
# comment instead, which is why it needs a write scope the PR job does not and
# therefore cannot share a job with it.
#
# ## THE TEXT IS NEVER INTERPOLATED INTO A SHELL COMMAND
#
# Following `.github/workflows/pr-inherit-issue-labels.yml`: an issue body is
# attacker-controlled text, so it is fetched SERVER-SIDE with `gh ... --json`
# and handed to the checker as a JSON file. A `github.event.issue.body`
# expression is never written anywhere in this file. Only NUMBERS and the
# repository name cross into shell, through `env:`, quoted.
#
# ## What this check can and cannot do
#
# It runs AFTER the text is public. On a PR the failing check blocks the merge;
# on an issue or a comment the text is already published and the check can only
# report it and ask for an edit. That is the cost of moving the rule from a
# PreToolUse gate to CI, and it is the right trade: the gate could only ever
# steer this repo's own agent sessions, while CI covers the web UI and every
# other client.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

# Least privilege at the top; the job extends it explicitly.
permissions: {}

concurrency:
  group: issue-conventions-${{ github.event_name }}-${{ github.event.issue.number }}-${{ github.event.comment.id || 'x' }}
  cancel-in-progress: true

jobs:
  english-issue:
    name: English-only (issue / comment)
    # The Bot exclusion is not tidiness. This job POSTS A COMMENT, and a comment
    # is itself an `issue_comment: created` event -- so without it the job scans
    # its own output on every violation. That output is English and would pass,
    # which is exactly what makes it dangerous: it costs a run per comment and
    # reads as fine until one of those comments QUOTES an offending body back at
    # the author, at which point the check fails on text it wrote itself and the
    # author cannot clear it.
    #
    # The same rule is ALSO in the script, as `isBotSender`, and the script is
    # the authority: no test can read a workflow `if:` expression, so deleting
    # this clause would be silent. The `if:` stays as a cheap filter that avoids
    # spawning a runner.
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # `issue_comment: created` fires for ANY user's comment on ANY issue, and the
    # concurrency group keys on the comment id, so parallel comments never
    # coalesce -- this is the job an outsider can actually spawn at will. The
    # default timeout is 360 minutes; cap it.
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Node 24 strips type annotations, so `node scripts/*.ts` runs the
      # TypeScript directly. `run-install: false` because the checker imports
      # nothing outside node: builtins -- deliberately, so this workflow cannot
      # be blocked by a lockfile problem.
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: '24'
          cache: false
          run-install: false

      - name: Build the subject document
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          # Server-side fetch, per the header. `--argjson` so a NUMBER that is
          # not a number fails loudly here instead of becoming jq program text.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" \
              | jq --argjson n "$NUMBER" \
                  '{kind:"issue_comment", number:$n, body:.body, labels:[]}' > subject.json
          else
            gh issue view "$NUMBER" -R "$REPO" --json title,body,labels \
              | jq --argjson n "$NUMBER" \
                  '{kind:"issue", number:$n, title:.title, body:.body,
                    labels:[.labels[].name]}' > subject.json
          fi

      - name: Check for non-English text
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          # Passed so the SCRIPT decides what a Bot sender means, not only the
          # `if:` above -- see the rationale there.
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          set -uo pipefail
          rc=0
          node scripts/check-gh-body-english.ts subject.json > report.md || rc=$?
          # Piped through a NON-WHITESPACE prefix before it reaches the log. The
          # runner TRIM-STARTS each line before deciding whether it is a workflow
          # command, so the report's own two-space fence indent protects nothing:
          # an issue body whose first offending line is `::stop-commands::<text>`
          # would suppress every later annotation in this job -- and any GitHub
          # user can open an issue. The FILE stays pristine; it is posted as a
          # comment, where the fence has to render.
          sed 's/^/| /' report.md
          [ "$rc" = "0" ] && exit 0
          # rc 2 is "could not evaluate", never "clean". A checker that did not
          # look has not passed.
          [ "$rc" = "1" ] || exit "$rc"
          # Comment only on the CREATING action. On an `edited` event the job
          # still fails, but re-posting the same report on every save would be
          # spam; the comment from the original event still stands.
          if [ "$ACTION" = "opened" ] || [ "$ACTION" = "created" ]; then
            gh api "repos/$REPO/issues/$NUMBER/comments" -F body=@report.md --silent
          fi
          exit 1
